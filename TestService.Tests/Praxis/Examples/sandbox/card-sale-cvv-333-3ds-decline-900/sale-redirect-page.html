<html><head><link href="https://pci-gw-test.praxispay.com/css/themes/default-theme.css"    rel="stylesheet" type="text/css"><script>            let approved_url = "https://pci-gw-test.praxispay.com/api/gateway/response/Test/<merchant-number>-<tid>?status=approved";            let declined_url = "https://pci-gw-test.praxispay.com/api/gateway/response/Test/<merchant-number>-<tid>?status=declined";            let pending_url = "https://pci-gw-test.praxispay.com/api/gateway/response/Test/<merchant-number>-<tid>?status=pending";let verification_url = "https://pci-gw-test.praxispay.com/api/gateway/response/Test/<merchant-number>-<tid>?status=verification";            const submit3D = (type) => {                const form3ds = document.getElementById('sandbox_3ds_form');                if (type === 'decline') {                    form3ds.setAttribute('action', declined_url);                } else if (type === 'approved') {                    form3ds.setAttribute('action', approved_url);                } else if (type === 'verification') {                    form3ds.setAttribute('action', verification_url);                } else {                    form3ds.setAttribute('action', pending_url);                }                document.sandbox_3ds_form.submit();            };</script></head><body class="body"><div class="container">    <h1>3DSecure Confirmation Page</h1>    <h3>Please select transaction status:</h3>    <div class="form">        <form class="action declined-case" id="sandbox_3ds_form" name="sandbox_3ds_form" method="POST" action="#" style="align-items: center">            <select style="max-width: 275px; min-width: 160px; border-radius: 0;" id="error_code" name="error_code" class="select">                <option value="903">Do not honor</option>                <option value="906">Insufficient funds</option>                <option value="904" >Without message</option>                <option value="900">Card has been lost</option>                <option value="901">Card has been  stolen</option>                <option value="902">Declined due to fraud</option>                <option value="912">Declined due to suspected fraud</option>            </select>            <button type="button" onclick="submit3D('decline')" class="button declined normal">Decline</button>        </form>        <div class="action">            <button type="button" onclick="submit3D('pending')" class="button pending normal">Pending</button>            <button type="button" onclick="submit3D('approved')" class="button approve normal">Approve</button><button type="button" onclick="submit3D('verification')" class="button approve normal">Verification</button>        </div>    </div></div></body></html>
